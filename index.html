<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 포켓몬 찾기</title>
  <style>
    :root {
      --bg: #FFF7E3;
      --card: #FFFDF6;
      --yellow: #FFD54F;
      --yellow-soft: #FFF0B8;
      --yellow-deep: #F2B200;
      --line: #F0DDA4;
      --text: #4A3420;
      --text-soft: #7A5C3E;
      --focus: #D98E00;
    }

    * { box-sizing: border-box; }

    html { font-size: 20px; }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg);
      background-image: radial-gradient(#FBE8B4 1.5px, transparent 1.5px);
      background-size: 26px 26px;
      color: var(--text);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
      line-height: 1.6;
      word-break: keep-all;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }

    /* ---------- 머리말 ---------- */
    header { text-align: center; margin-bottom: 28px; }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: var(--yellow);
      font-size: 44px;
      box-shadow: 0 6px 0 var(--yellow-deep);
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2.1rem;
      line-height: 1.3;
    }

    .subtitle {
      margin: 0;
      font-size: 1.1rem;
      color: var(--text-soft);
    }

    /* ---------- 카드 공통 ---------- */
    .card {
      background: var(--card);
      border: 3px solid var(--line);
      border-radius: 28px;
      padding: 28px 22px;
      box-shadow: 0 8px 0 var(--line);
    }

    .step {
      margin: 0 0 20px;
      font-size: 1.3rem;
      text-align: center;
    }

    /* ---------- MBTI 버튼 ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .type-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 16px 6px;
      background: #fff;
      border: 3px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 5px 0 var(--line);
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
      transition: background-color .15s, border-color .15s, transform .1s, box-shadow .1s;
    }

    .type-btn .code {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .type-btn .nick {
      font-size: 0.8rem;
      color: var(--text-soft);
    }

    .type-btn:hover {
      background: var(--yellow-soft);
      border-color: var(--yellow);
      box-shadow: 0 5px 0 var(--yellow-deep);
    }

    .type-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--yellow-deep);
    }

    button:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 3px;
    }

    .hint {
      margin: 22px 0 0;
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-soft);
    }

    /* ---------- 결과 ---------- */
    .result { text-align: center; }

    .result-title {
      margin: 0 0 18px;
      font-size: 1.25rem;
      font-weight: 700;
      outline: none;
    }

    .badge {
      display: inline-block;
      padding: 2px 14px;
      margin-right: 4px;
      border-radius: 999px;
      background: var(--yellow);
      font-weight: 800;
      letter-spacing: 1px;
    }

    .poke-circle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 250px;
      height: 250px;
      margin: 10px auto 28px;
      border-radius: 50%;
      background: #fff;
      border: 6px solid var(--yellow);
      box-shadow: 0 0 0 10px var(--yellow-soft);
    }

    .poke-img {
      width: 200px;
      height: 200px;
      object-fit: contain;
    }

    .pop { animation: pop .45s ease-out; }

    @keyframes pop {
      0%   { transform: scale(.6); opacity: 0; }
      70%  { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); }
    }

    .poke-name {
      margin: 0;
      font-size: 2.4rem;
      line-height: 1.3;
    }

    .poke-type {
      display: inline-block;
      margin: 8px 0 22px;
      padding: 2px 14px;
      border-radius: 999px;
      border: 2px solid var(--line);
      background: #fff;
      font-size: 0.95rem;
      color: var(--text-soft);
    }

    .reasons {
      list-style: none;
      margin: 0 auto 26px;
      padding: 18px 20px;
      max-width: 560px;
      text-align: left;
      background: #fff;
      border-radius: 20px;
      border: 2px solid var(--line);
    }

    .reasons li {
      position: relative;
      padding-left: 34px;
      font-size: 1.1rem;
    }

    .reasons li + li { margin-top: 10px; }

    .reasons li::before {
      content: "⭐";
      position: absolute;
      left: 0;
      top: 0;
    }

    .match {
      max-width: 560px;
      margin: 0 auto 28px;
      padding: 20px;
      border-radius: 20px;
      border: 3px dashed var(--yellow-deep);
      background: var(--yellow-soft);
    }

    .match-label {
      margin: 0 0 8px;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .match-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .match-img {
      width: 84px;
      height: 84px;
      padding: 4px;
      object-fit: contain;
      border-radius: 50%;
      border: 3px solid var(--yellow);
      background: #fff;
    }

    .match-main {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 800;
    }

    .match-why {
      margin: 0 0 14px;
      font-size: 1rem;
      color: var(--text-soft);
    }

    .small-btn {
      padding: 8px 18px;
      border: 2px solid var(--yellow-deep);
      border-radius: 999px;
      background: #fff;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .small-btn:hover { background: var(--yellow); }

    .retry-btn {
      display: inline-block;
      padding: 16px 40px;
      border: none;
      border-radius: 999px;
      background: var(--yellow);
      box-shadow: 0 6px 0 var(--yellow-deep);
      color: var(--text);
      font-family: inherit;
      font-size: 1.3rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform .1s, box-shadow .1s, background-color .15s;
    }

    .retry-btn:hover { background: #FFCC2E; }

    .retry-btn:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 var(--yellow-deep);
    }

    footer {
      margin-top: 28px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-soft);
    }

    [hidden] { display: none !important; }

    /* ---------- 작은 화면 ---------- */
    @media (max-width: 560px) {
      html { font-size: 18px; }
      .wrap { padding-top: 24px; }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .card { padding: 24px 16px; }
      .poke-circle { width: 200px; height: 200px; }
      .poke-img { width: 160px; height: 160px; }
      .poke-name { font-size: 2rem; }
      .retry-btn { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo" aria-hidden="true">🔍</div>
      <h1>MBTI로 포켓몬 찾기</h1>
      <p class="subtitle">나와 닮은 포켓몬은 누구일까요?</p>
    </header>

    <main>
      <!-- 1단계: MBTI 고르기 -->
      <section id="pick" class="card" aria-labelledby="pick-title">
        <h2 id="pick-title" class="step">👇 나의 MBTI를 눌러 주세요</h2>
        <div id="grid" class="grid"></div>
        <p class="hint">버튼 하나만 누르면 바로 결과가 나와요!</p>
      </section>

      <!-- 2단계: 결과 보기 -->
      <section id="result" class="card result" aria-live="polite" hidden>
        <p id="result-title" class="result-title" tabindex="-1">
          <span id="r-code" class="badge"></span> 유형과 어울리는 포켓몬은...
        </p>

        <div id="r-circle" class="poke-circle">
          <img id="r-img" class="poke-img" alt="" width="200" height="200">
        </div>
        <h2 id="r-name" class="poke-name"></h2>
        <span id="r-type" class="poke-type"></span>

        <ul id="r-reasons" class="reasons"></ul>

        <div class="match">
          <p class="match-label">💞 나와 잘 맞는 유형</p>
          <div class="match-row">
            <img id="m-img" class="match-img" alt="" width="84" height="84">
            <p id="m-main" class="match-main"></p>
          </div>
          <p id="m-why" class="match-why"></p>
          <button id="m-btn" class="small-btn" type="button">이 유형의 포켓몬 보기 →</button>
        </div>

        <button id="retry" class="retry-btn" type="button">🔄 다시 고르기</button>
      </section>
    </main>

    <footer>
      재미로 보는 결과예요. 즐겁게 봐 주세요 😊<br>
      <small>포켓몬 이미지 © Nintendo · Creatures · GAME FREAK · The Pokémon Company</small>
    </footer>
  </div>

  <script>

    var DATA = {

        reasons: [
          "어디서나 밝고 반짝이는 에너지를 뿜어요.",
          "처음 만난 사람과도 금방 친구가 돼요.",

    // 버튼 표시 순서 (4줄 × 4칸)
    var ORDER = [
      "INTJ", "INTP", "ENTJ", "ENTP",
      "INFJ", "INFP", "ENFJ", "ENFP",
      "ISTJ", "ISFJ", "ESTJ", "ESFJ",
      "ISTP", "ISFP", "ESTP", "ESFP"
    ];

    var $ = function (id) { return document.getElementById(id); };
    var pickSection = $("pick");
    var resultSection = $("result");
    var lastCode = null;

    // MBTI 버튼 16개 만들기
    ORDER.forEach(function (code) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "type-btn";
      btn.dataset.code = code;
      btn.innerHTML =
        '<span class="code">' + code + '</span>' +
        '<span class="nick">' + DATA[code].nick + '</span>';
      btn.addEventListener("click", function () { showResult(code); });
      $("grid").appendChild(btn);
    });

    // 결과 보여 주기 (포켓몬 이미지 IMAGES는 파일 맨 아래에 있어요)
    function showResult(code) {
      var p = DATA[code];
      var m = DATA[p.match];
      lastCode = code;

      $("r-code").textContent = code;
      $("r-img").src = IMAGES[p.no];
      $("r-img").alt = p.name + " 공식 이미지";
      $("r-name").textContent = p.name;
      $("r-type").textContent = "No." + ("00" + p.no).slice(-3) + " · " + p.type;

      var list = $("r-reasons");
      list.innerHTML = "";
      p.reasons.forEach(function (text) {
        var li = document.createElement("li");
        li.textContent = text;
        list.appendChild(li);
      });

      $("m-img").src = IMAGES[m.no];
      $("m-img").alt = m.name + " 공식 이미지";
      $("m-main").textContent = p.match + " · " + m.name;
      $("m-why").textContent = p.matchWhy;
      $("m-btn").onclick = function () { showResult(p.match); };

      // 포켓몬 등장 애니메이션 다시 실행
      var circle = $("r-circle");
      circle.classList.remove("pop");
      void circle.offsetWidth;
      circle.classList.add("pop");

      pickSection.hidden = true;
      resultSection.hidden = false;
      window.scrollTo(0, 0);
      $("result-title").focus();
    }

    // 처음 화면으로 돌아가기
    $("retry").addEventListener("click", function () {
      resultSection.hidden = true;
      pickSection.hidden = false;
      window.scrollTo(0, 0);
      var prev = document.querySelector('.type-btn[data-code="' + lastCode + '"]');
      if (prev) prev.focus();
    });
  </script>
