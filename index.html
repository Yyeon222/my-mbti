<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 포켓몬 찾기</title>
  <style>
    :root {
      --bg: #FFF7E3;
      --card: #FFFDF6;
      --yellow: #FFD54F;
      --yellow-soft: #FFF0B8;
      --yellow-deep: #F2B200;
      --line: #F0DDA4;
      --text: #4A3420;
      --text-soft: #7A5C3E;
      --focus: #D98E00;
    }

    * { box-sizing: border-box; }

    html { font-size: 20px; }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg);
      background-image: radial-gradient(#FBE8B4 1.5px, transparent 1.5px);
      background-size: 26px 26px;
      color: var(--text);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
      line-height: 1.6;
      word-break: keep-all;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }

    /* ---------- 머리말 ---------- */
    header { text-align: center; margin-bottom: 28px; }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: var(--yellow);
      font-size: 44px;
      box-shadow: 0 6px 0 var(--yellow-deep);
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2.1rem;
      line-height: 1.3;
    }

    .subtitle {
      margin: 0;
      font-size: 1.1rem;
      color: var(--text-soft);
    }

    /* ---------- 카드 공통 ---------- */
    .card {
      background: var(--card);
      border: 3px solid var(--line);
      border-radius: 28px;
      padding: 28px 22px;
      box-shadow: 0 8px 0 var(--line);
    }

    .step {
      margin: 0 0 20px;
      font-size: 1.3rem;
      text-align: center;
    }

    /* ---------- MBTI 버튼 ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .type-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 16px 6px;
      background: #fff;
      border: 3px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 5px 0 var(--line);
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
      transition: background-color .15s, border-color .15s, transform .1s, box-shadow .1s;
    }

    .type-btn .code {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .type-btn .nick {
      font-size: 0.8rem;
      color: var(--text-soft);
    }

    .type-btn:hover {
      background: var(--yellow-soft);
      border-color: var(--yellow);
      box-shadow: 0 5px 0 var(--yellow-deep);
    }

    .type-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--yellow-deep);
    }

    button:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 3px;
    }

    .hint {
      margin: 22px 0 0;
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-soft);
    }

    /* ---------- 결과 ---------- */
    .result { text-align: center; }

    .result-title {
      margin: 0 0 18px;
      font-size: 1.25rem;
      font-weight: 700;
      outline: none;
    }

    .badge {
      display: inline-block;
      padding: 2px 14px;
      margin-right: 4px;
      border-radius: 999px;
      background: var(--yellow);
      font-weight: 800;
      letter-spacing: 1px;
    }

    .emoji-circle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 210px;
      height: 210px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--yellow-soft);
      border: 5px solid var(--yellow);
      font-size: 120px;
      line-height: 1;
    }

    .pop { animation: pop .45s ease-out; }

    @keyframes pop {
      0%   { transform: scale(.6); opacity: 0; }
      70%  { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); }
    }

    .poke-name {
      margin: 0;
      font-size: 2.4rem;
      line-height: 1.3;
    }

    .poke-type {
      display: inline-block;
      margin: 8px 0 22px;
      padding: 2px 14px;
      border-radius: 999px;
      border: 2px solid var(--line);
      background: #fff;
      font-size: 0.95rem;
      color: var(--text-soft);
    }

    .reasons {
      list-style: none;
      margin: 0 auto 26px;
      padding: 18px 20px;
      max-width: 560px;
      text-align: left;
      background: #fff;
      border-radius: 20px;
      border: 2px solid var(--line);
    }

    .reasons li {
      position: relative;
      padding-left: 34px;
      font-size: 1.1rem;
    }

    .reasons li + li { margin-top: 10px; }

    .reasons li::before {
      content: "⭐";
      position: absolute;
      left: 0;
      top: 0;
    }

    .match {
      max-width: 560px;
      margin: 0 auto 28px;
      padding: 20px;
      border-radius: 20px;
      border: 3px dashed var(--yellow-deep);
      background: var(--yellow-soft);
    }

    .match-label {
      margin: 0 0 8px;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .match-main {
      margin: 0 0 6px;
      font-size: 1.4rem;
      font-weight: 800;
    }

    .match-why {
      margin: 0 0 14px;
      font-size: 1rem;
      color: var(--text-soft);
    }

    .small-btn {
      padding: 8px 18px;
      border: 2px solid var(--yellow-deep);
      border-radius: 999px;
      background: #fff;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .small-btn:hover { background: var(--yellow); }

    .retry-btn {
      display: inline-block;
      padding: 16px 40px;
      border: none;
      border-radius: 999px;
      background: var(--yellow);
      box-shadow: 0 6px 0 var(--yellow-deep);
      color: var(--text);
      font-family: inherit;
      font-size: 1.3rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform .1s, box-shadow .1s, background-color .15s;
    }

    .retry-btn:hover { background: #FFCC2E; }

    .retry-btn:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 var(--yellow-deep);
    }

    footer {
      margin-top: 28px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-soft);
    }

    [hidden] { display: none !important; }

    /* ---------- 작은 화면 ---------- */
    @media (max-width: 560px) {
      html { font-size: 18px; }
      .wrap { padding-top: 24px; }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .card { padding: 24px 16px; }
      .emoji-circle { width: 170px; height: 170px; font-size: 96px; }
      .poke-name { font-size: 2rem; }
      .retry-btn { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo" aria-hidden="true">🔍</div>
      <h1>MBTI로 포켓몬 찾기</h1>
      <p class="subtitle">나와 닮은 포켓몬은 누구일까요?</p>
    </header>

    <main>
      <!-- 1단계: MBTI 고르기 -->
      <section id="pick" class="card" aria-labelledby="pick-title">
        <h2 id="pick-title" class="step">👇 나의 MBTI를 눌러 주세요</h2>
        <div id="grid" class="grid"></div>
        <p class="hint">버튼 하나만 누르면 바로 결과가 나와요!</p>
      </section>

      <!-- 2단계: 결과 보기 -->
      <section id="result" class="card result" aria-live="polite" hidden>
        <p id="result-title" class="result-title" tabindex="-1">
          <span id="r-code" class="badge"></span> 유형과 어울리는 포켓몬은...
        </p>

        <div id="r-emoji" class="emoji-circle" aria-hidden="true"></div>
        <h2 id="r-name" class="poke-name"></h2>
        <span id="r-type" class="poke-type"></span>

        <ul id="r-reasons" class="reasons"></ul>

        <div class="match">
          <p class="match-label">💞 나와 잘 맞는 유형</p>
          <p id="m-main" class="match-main"></p>
          <p id="m-why" class="match-why"></p>
          <button id="m-btn" class="small-btn" type="button">이 유형의 포켓몬 보기 →</button>
        </div>

        <button id="retry" class="retry-btn" type="button">🔄 다시 고르기</button>
      </section>
    </main>

    <footer>재미로 보는 결과예요. 즐겁게 봐 주세요 😊</footer>
  </div>

  <script>

      },

        reasons: [

          "호기심이 많아 새로운 모험이 늘 신나요."
        ],
        match: "INTJ", matchWhy: "흩어지는 아이디어를 멋진 계획으로 정리해 줘요."
      },
      ISTJ: {
        nick: "원칙주의자", name: "거북왕", emoji: "🐢", type: "물 타입",
        reasons: [
          "단단한 등껍질처럼 믿음직하고 흔들림이 없어요.",
          "맡은 일은 끝까지 책임지고 해내요.",
          "약속과 규칙을 소중히 여겨요."
        ],
        match: "ESFP", matchWhy: "반복되는 하루에 즐거운 웃음을 더해 줘요."
      },
      ISFJ: {
        nick: "수호자", name: "럭키", emoji: "🥚", type: "노말 타입",
        reasons: [
          "다친 친구를 정성껏 돌봐 주는 따뜻한 마음씨예요.",
          "눈에 띄지 않아도 묵묵히 주변을 챙겨요.",

        ],

      ESTJ: {
        nick: "관리자", name: "괴력몬", emoji: "💪", type: "격투 타입",

        ],
        match: "ISFP", matchWhy: "바쁜 당신에게 쉼과 여유를 알려 줘요."

        ],

      },
      ISTP: {
        nick: "장인", name: "개굴닌자", emoji: "🐸", type: "물·악 타입",
        reasons: [
          "조용하지만 위기 상황에서 누구보다 빠르게 움직여요.",

        ],
        match: "ESTJ", matchWhy: "망설일 때 확실한 방향을 잡아 줘요."
      },
      ESTP: {
        nick: "모험가", name: "윈디", emoji: "🐕", type: "불꽃 타입",
        reasons: [

          "바람처럼 빠르게 달리며 모험을 즐겨요.",
          "위기 상황에서도 겁먹지 않는 용감한 성격이에요."
        ],
        match: "ISFJ", matchWhy: "앞만 보고 달리는 당신을 뒤에서 살뜰히 챙겨 줘요."
      },
      ESFP: {
        nick: "연예인", name: "푸린", emoji: "🎤", type: "노말·페어리 타입",
        reasons: [
          "무대에 서면 누구보다 반짝이는 타고난 스타예요.",
          "노래와 웃음으로 주변을 즐겁게 만들어요.",
          "지금 이 순간을 마음껏 즐길 줄 알아요."
        ],
        match: "ISTJ", matchWhy: "들뜬 당신 곁을 차분하고 든든하게 지켜 줘요."
      }
    };

    // 버튼 표시 순서 (4줄 × 4칸)
    var ORDER = [
      "INTJ", "INTP", "ENTJ", "ENTP",
      "INFJ", "INFP", "ENFJ", "ENFP",
      "ISTJ", "ISFJ", "ESTJ", "ESFJ",
      "ISTP", "ISFP", "ESTP", "ESFP"
    ];

    var $ = function (id) { return document.getElementById(id); };
    var pickSection = $("pick");
    var resultSection = $("result");
    var lastCode = null;

    // MBTI 버튼 16개 만들기
    ORDER.forEach(function (code) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "type-btn";
      btn.dataset.code = code;
      btn.innerHTML =
        '<span class="code">' + code + '</span>' +
        '<span class="nick">' + DATA[code].nick + '</span>';
      btn.addEventListener("click", function () { showResult(code); });
      $("grid").appendChild(btn);
    });

    // 결과 보여 주기
    function showResult(code) {
      var p = DATA[code];
      var m = DATA[p.match];
      lastCode = code;

      $("r-code").textContent = code;
      $("r-emoji").textContent = p.emoji;
      $("r-name").textContent = p.name;
      $("r-type").textContent = p.type;

      var list = $("r-reasons");
      list.innerHTML = "";
      p.reasons.forEach(function (text) {
        var li = document.createElement("li");
        li.textContent = text;
        list.appendChild(li);
      });

      $("m-main").textContent = p.match + " · " + m.name + " " + m.emoji;
      $("m-why").textContent = p.matchWhy;
      $("m-btn").onclick = function () { showResult(p.match); };

      // 이모지 등장 애니메이션 다시 실행
      var circle = $("r-emoji");
      circle.classList.remove("pop");
      void circle.offsetWidth;
      circle.classList.add("pop");

      pickSection.hidden = true;
      resultSection.hidden = false;
      window.scrollTo(0, 0);
      $("result-title").focus();
    }

    // 처음 화면으로 돌아가기
    $("retry").addEventListener("click", function () {
      resultSection.hidden = true;
      pickSection.hidden = false;
      window.scrollTo(0, 0);
      var prev = document.querySelector('.type-btn[data-code="' + lastCode + '"]');
      if (prev) prev.focus();
    });
  </script>
</body>
</html>
